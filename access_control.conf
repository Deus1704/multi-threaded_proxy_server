# Proxy access control + routing.
# Rules are evaluated top to bottom; the FIRST match wins. If no rule matches,
# the `default` policy applies. First-match-wins is what makes
# "allow exactly these, deny everything else" expressible in two lines.
#
# Syntax
#   default allow|deny
#   allow|deny host   <pattern>
#   allow|deny path   <pattern>
#   allow|deny method <NAME>
#   route <host-pattern> <upstream-host> <upstream-port>
#
# Patterns: "*" (any), "*.suffix" (subdomain match), "prefix*" (prefix match),
#           or an exact literal.

# ---- method allowlist -------------------------------------------------------
# CONNECT would mean tunnelling opaque bytes, which this proxy cannot inspect,
# cache, or log. Refuse it rather than half-supporting it.
deny  method connect
deny  method trace

# ---- host denylist ----------------------------------------------------------
deny  host blocked.example.com
deny  host *.doubleclick.net
deny  host *.ads.example.com

# ---- path denylist ---------------------------------------------------------
# Admin surfaces should never be reachable through a shared caching proxy: a
# cached 200 for /admin/* could be replayed to a different, unauthorised client.
deny  path /admin/*
deny  path /.git/*

# ---- routing ---------------------------------------------------------------
# Send a logical hostname to a concrete upstream. Without a matching route the
# proxy resolves the Host header directly (host-header routing).
route origin.test 127.0.0.1 19000

# ---- default ---------------------------------------------------------------
default allow
